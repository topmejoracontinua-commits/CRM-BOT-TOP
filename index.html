<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM Top Neumáticos</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23e0141e%22/%3E%3Cpath d=%22M12 16h40v11H37v25H27V27H12z%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23e0141e%22/%3E%3Cpath d=%22M12 16h40v11H37v25H27V27H12z%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
/* Layout: cabecera con marca + pestañas; contenido en una columna ancha; tablas dentro de contenedores con scroll */
:root{
  --verde:#0d0d0d; --verde-2:#171717; --verde-3:#2b2b2b; --linea:#ffffff24;
  --blanco:#ffffff; --texto:#f2f2f2; --apagado:#a8a8a8;
  --naranja:#e0141e; --amarillo:#ffffff; --rojo:#ff6b5b; --ok:#5fd68a;
  --f-display:'Manrope',system-ui,'Segoe UI',sans-serif;
  --f-body:'Manrope',system-ui,'Segoe UI',sans-serif;
  --f-label:'Manrope',system-ui,'Segoe UI',sans-serif;
  --f-marca:'Archivo Black','Arial Black',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--verde);color:var(--texto);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1180px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amarillo);outline-offset:2px}

/* Marca */
.marca{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1;position:relative}
.marca b{font:400 34px/0.9 var(--f-marca);letter-spacing:.02em;color:var(--blanco);position:relative;padding-top:6px}
.marca b::before{content:"";position:absolute;left:-4px;right:-4px;top:-2px;height:14px;border-top:4px solid var(--naranja);border-radius:60% 60% 0 0/100% 100% 0 0}
.marca i{font:700 10.5px var(--f-label);letter-spacing:.5em;color:var(--blanco);font-style:normal;margin-top:5px;text-transform:uppercase}
.marca.grande b{font-size:64px}.marca.grande i{font-size:17px}
.logo-top{background:#fff;border-radius:10px;padding:6px 12px;display:inline-flex;align-items:center}.logo-top img{height:46px;width:auto;display:block}.logo-top.grande img{height:96px}.westlake{font:400 12px var(--f-marca);color:var(--amarillo);letter-spacing:.04em;border:2px solid var(--amarillo);padding:2px 7px;border-radius:3px;white-space:nowrap}

/* Cabecera */
header{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;padding:18px 0 14px;border-bottom:1px solid var(--linea)}
header .quien{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--apagado);font-size:13px;min-width:0}
header .quien span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
nav{display:flex;gap:4px;flex-wrap:wrap;width:100%;order:3}
nav button{background:none;border:0;padding:10px 16px;font:600 14.5px var(--f-body);color:var(--apagado);cursor:pointer;border-bottom:3px solid transparent}
nav button:hover{color:var(--blanco)}
nav button[aria-selected=true]{color:var(--blanco);border-bottom-color:var(--naranja)}
.btn{background:var(--naranja);color:#fff;border:0;border-radius:6px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:transparent;border:1px solid var(--verde-3);color:var(--texto)}
.btn.sec:hover{border-color:var(--apagado)}
.btn:disabled{opacity:.6;cursor:wait}

h2{font:800 24px/1.2 var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--apagado);font-size:13px}
.etq{font:700 11.5px var(--f-label);letter-spacing:.07em;text-transform:uppercase;color:var(--apagado)}
section.vista{padding-top:24px}
.fila{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}

/* Indicadores */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:28px}
.kpi{background:var(--verde-2);border:1px solid var(--linea);border-radius:10px;padding:18px 20px}
.kpi .n{font:800 44px/1 var(--f-display);letter-spacing:-.03em;color:var(--blanco);font-variant-numeric:tabular-nums;margin-top:8px}
.kpi.dest{border-color:var(--amarillo)}
.kpi.dest .n{color:var(--amarillo)}
.kpi small{display:block;color:var(--apagado);margin-top:6px;font-size:13px}
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}
.dos>*{min-width:0}
.panel{background:var(--verde-2);border:1px solid var(--linea);border-radius:10px;padding:18px 20px}
.panel h3{margin:0 0 12px;font:700 12px var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--amarillo)}
.item{display:flex;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--linea)}
.item:first-of-type{border-top:0}
.item .hora{font:800 16px var(--f-display);min-width:58px;color:var(--blanco);font-variant-numeric:tabular-nums}
.item .cuerpo{flex:1;min-width:0}
.item .cuerpo b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vacio{color:var(--apagado);padding:18px 0;text-align:center}

/* Tablas */
.tabla{overflow-x:auto;background:var(--verde-2);border:1px solid var(--linea);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font:600 11.5px var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--apagado);text-align:left;padding:12px 14px;border-bottom:1px solid var(--linea);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--linea);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#ffffff08}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.medida{font:700 13px var(--f-label);letter-spacing:.02em;background:var(--verde);border:1px solid var(--verde-3);padding:2px 8px;border-radius:4px;white-space:normal;overflow-wrap:anywhere;display:inline-block;max-width:100%;line-height:1.5;vertical-align:top}

/* Estados */
.pill{display:inline-block;font:700 11px var(--f-label);letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;white-space:nowrap;border:1px solid}
.p-agendado,.p-agendada{color:var(--amarillo);border-color:var(--amarillo)}
.p-confirmado{color:var(--ok);border-color:var(--ok)}
.p-realizado,.p-cerrada{color:var(--blanco);border-color:var(--blanco);background:#ffffff18}
.p-cancelado,.p-perdida,.p-no_vino{color:var(--rojo);border-color:var(--rojo)}
.p-derivada{color:#ff4d4d;border-color:#ff4d4d;background:#ff4d4d1f;font-weight:800}
.p-pausa{color:var(--naranja);border-color:var(--naranja)}
.p-mayorista{color:#4da3ff;border-color:#4da3ff;background:#4da3ff1f;font-weight:800}
.col[data-etapa="mayorista"]{background:#3d8bff12;border-color:#4da3ff}
.col[data-etapa="mayorista"]>h3{color:#7bbaff}
.col[data-etapa="mayorista"] .tarjeta{border-color:#4da3ff;border-left:5px solid #4da3ff;background:#142a40}
.alerta-may{display:inline-block;align-self:flex-start;background:#4da3ff;color:#06182a;border-radius:4px;padding:2px 8px;font:800 11px var(--f-label);letter-spacing:.06em;text-transform:uppercase}
.col[data-etapa="derivada"]{background:#ff3b3014;border-color:#ff4d4d}
.col[data-etapa="derivada"]>h3{color:#ff6b6b}
.col[data-etapa="derivada"]>h3 .pt{box-shadow:0 0 0 0 #ff4d4d99;animation:latido 1.6s infinite}
.col[data-etapa="derivada"] .tarjeta{border-color:#ff4d4d;border-left:5px solid #ff4d4d;background:#3a1816}
.alerta-der{display:inline-block;align-self:flex-start;background:#ff4d4d;color:#fff;border-radius:4px;padding:2px 8px;font:800 11px var(--f-label);letter-spacing:.06em;text-transform:uppercase}
@keyframes latido{0%{box-shadow:0 0 0 0 #ff4d4d99}70%{box-shadow:0 0 0 8px #ff4d4d00}100%{box-shadow:0 0 0 0 #ff4d4d00}}
@media (prefers-reduced-motion:reduce){.col[data-etapa="derivada"]>h3 .pt{animation:none}}
.p-abierta{color:var(--apagado);border-color:var(--apagado)}
select,input[type=text],input[type=email],input[type=password],input[type=search]{background:var(--verde);border:1px solid var(--verde-3);border-radius:6px;padding:8px 10px;color:var(--texto);max-width:100%}
select{cursor:pointer}
.etqs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip-e{display:inline-flex;align-items:center;gap:4px;background:var(--verde);border:1px solid var(--verde-3);color:var(--texto);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.chip-e.may{background:var(--amarillo);border-color:var(--amarillo);color:#0d0d0d;font-weight:800}
.chip-e button{background:none;border:0;color:inherit;cursor:pointer;padding:0 0 0 2px;font-size:15px;line-height:1}
.sug{display:flex;gap:6px;flex-wrap:wrap}
.sug button{background:transparent;border:1px dashed var(--verde-3);color:var(--texto);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
.sug button:hover{border-color:var(--amarillo)}
.campana{position:relative;display:inline-flex;align-items:center;gap:6px;padding:8px 12px}
.campana svg{width:18px;height:18px}
.campana em.badge{font-style:normal;position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--naranja);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;border:2px solid var(--verde)}
.campana em.badge.rojo{background:#e5483a}
.campana em.badge[hidden]{display:none}
.notif{position:absolute;right:0;top:calc(100% + 10px);width:min(380px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:var(--verde);border:1px solid var(--verde-3);border-radius:12px;box-shadow:0 18px 40px #00000066;z-index:60;text-align:left}
.notif[hidden]{display:none}
.notif h3{margin:0;padding:14px 16px 10px;font:700 12px var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--amarillo)}
.notif button.n-it{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--linea);padding:12px 16px;cursor:pointer;color:var(--texto)}
.notif button.n-it:hover{background:var(--verde-2)}
.n-pt{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--apagado)}
.n-pt.alta{background:#ff6b5b}.n-pt.media{background:var(--amarillo)}
.n-it b{display:block;font-size:14px;overflow-wrap:anywhere}
.n-it .sub{display:block;font-size:12px;margin-top:2px}
.n-nueva{background:var(--naranja);color:#fff;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:800;margin-left:6px;letter-spacing:.04em;vertical-align:middle}
.notif .vacio{padding:22px 16px}
header .quien .notif span{overflow:visible;text-overflow:clip;white-space:normal;max-width:none}
.n-it>span:last-child{min-width:0;flex:1}
#toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));max-width:min(380px,calc(100vw - 32px));background:var(--verde-2);border:1px solid var(--amarillo);border-radius:10px;padding:14px 16px;box-shadow:0 14px 34px #00000066;z-index:80;cursor:pointer;font-size:14px;line-height:1.45}
#toast[hidden]{display:none}
.combo{position:relative}
.combo input{width:100%;padding:10px 38px 10px 12px}
.combo input.sel{border-color:var(--amarillo);font-weight:700}
.combo-x{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:var(--apagado);font-size:22px;line-height:1;cursor:pointer;padding:4px 8px}
.combo-x:hover{color:var(--texto)}.combo-x[hidden]{display:none}
.combo-lista{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:var(--verde);border:1px solid var(--verde-3);border-radius:10px;box-shadow:0 16px 36px #00000066;max-height:280px;overflow:auto;padding:4px}
.combo-lista[hidden]{display:none}
.combo-it{display:flex;flex-direction:column;gap:2px;padding:9px 12px;border-radius:7px;cursor:pointer;color:var(--texto)}
.combo-it b{font-size:14px;overflow-wrap:anywhere;color:var(--texto)}
.combo-it .sub{font-size:12px}
.combo-it.act,.combo-it:hover{background:var(--verde-2)}
.combo-it mark{background:transparent;color:var(--amarillo);font-weight:800}
.combo-vacio{padding:14px 12px;color:var(--apagado);font-size:13px}
input[type=date],textarea{background:var(--verde);border:1px solid var(--verde-3);border-radius:6px;padding:8px 10px;color:var(--texto);max-width:100%;color-scheme:dark}
.formtarea{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;align-items:end;margin-bottom:20px}
.formtarea label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--apagado)}
.formtarea .ancho{grid-column:1/-1}
.vencida{color:var(--rojo,#ff6b5b);font-weight:700}
.tarjeta .asig{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input::placeholder{color:#8a8a8a}
.filtros{display:flex;gap:10px;flex-wrap:wrap}
a.wa{color:var(--ok);text-decoration:none;font-weight:600}
a.wa:hover{text-decoration:underline}
.guardado{color:var(--ok);font-size:12px;margin-left:6px}

/* Login */
#login[hidden]{display:none}
#login{display:grid;place-items:center;min-height:100vh;padding-block:40px}
.caja{width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px}
.caja form{background:var(--verde-2);border:1px solid var(--linea);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px}
.caja label{display:flex;flex-direction:column;gap:6px}
.caja input{width:100%;padding:11px 12px}
.error{color:var(--rojo);font-size:14px;min-height:20px}
.aviso{background:#ffffff1c;border:1px solid var(--amarillo);color:var(--amarillo);border-radius:8px;padding:10px 14px;font-size:13px;margin-top:16px}
/* Pipeline */
.tablero{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:14px;overflow-x:auto;padding-bottom:12px;align-items:start}
.col{background:#00000026;border:1px solid var(--linea);border-radius:10px;padding:12px;min-height:260px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col.sobre{outline:2px dashed var(--amarillo);outline-offset:-2px}
.col>h3{margin:2px 2px 4px;font:700 12px var(--f-label);letter-spacing:.07em;text-transform:uppercase;color:var(--texto);display:flex;align-items:center;gap:8px}
.col>h3 .pt{width:9px;height:9px;border-radius:50%;background:var(--c,var(--apagado))}
.col>h3 .ct{margin-left:auto;color:var(--apagado);font-variant-numeric:tabular-nums}
.tarjeta{background:var(--verde-2);border:1px solid var(--linea);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:grab;min-width:0}
.tarjeta.arrastra{opacity:.45}
.tarjeta b{overflow-wrap:anywhere}
.tarjeta .acc{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tarjeta select{font-size:13px;padding:5px 8px}
.vacio-col{color:var(--apagado);font-size:13px;text-align:center;padding:18px 6px;border:1px dashed var(--linea);border-radius:8px}
/* Calendario */
.seg{display:inline-flex;border:1px solid var(--verde-3);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:8px 14px;font-weight:600;color:var(--apagado);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--verde-3);color:var(--blanco)}
.mesnav{display:flex;align-items:center;gap:8px}
.mesnav h2{min-width:170px;text-align:center;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--linea);border:1px solid var(--linea);border-radius:10px;overflow:hidden}
.cal .dow{background:var(--verde-2);padding:9px 6px;text-align:center;font:700 11.5px var(--f-label);letter-spacing:.06em;color:var(--apagado)}
.cal .vacia{background:#0000001f;min-height:92px}
.cal .dia{background:var(--verde-2);min-height:92px;padding:7px;text-align:left;border:0;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;color:inherit}
.cal .dia:hover{background:var(--verde-3)}
.cal .dia.dom{background:#0000001a}
.cal .dia.sel{outline:2px solid var(--amarillo);outline-offset:-2px}
.cal .dia .n{font:700 13px var(--f-label);color:var(--apagado);font-variant-numeric:tabular-nums}
.cal .dia.hoy .n{background:var(--naranja);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.cal .chip{font-size:12px;font-weight:600;background:#ffffff26;color:var(--amarillo);border-radius:4px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .chip.ok{background:#5fd68a24;color:var(--ok)}
.cal .chip.tarea{background:#e0141e29;color:#ff8f8f}
.cal .dia{overflow:hidden}
.cal .chip{display:block;width:100%;max-width:100%;box-sizing:border-box}
.cal .chip.tarea{white-space:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}
.cal .chip.tarea.hecha{opacity:.55;text-decoration:line-through}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--apagado);margin:10px 2px 0}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cal .mas{font-size:11.5px;color:var(--apagado)}
.cal .punto{display:none;font-weight:800;font-size:12px;background:var(--amarillo);color:var(--verde);border-radius:99px;min-width:20px;height:20px;place-items:center;padding:0 5px;align-self:flex-start}
@media (max-width:640px){.cal .chip,.cal .mas{display:none}.cal .punto{display:inline-grid}.cal .dia,.cal .vacia{min-height:56px;padding:5px}.mesnav h2{min-width:0;font-size:19px}}
/* Ingresos */
.ing{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px;align-items:end}
.ing .cifras{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
.ing .cifras .grande{grid-column:1/-1}
.ing .v{font:800 28px/1.1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:4px}
.ing .grande .v{font-size:40px;color:var(--amarillo)}
.barras{display:flex;gap:10px;align-items:flex-end;height:150px}
.barras .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;min-width:0}
.barras .b i{display:block;width:100%;max-width:44px;border-radius:5px 5px 0 0;background:var(--verde-3);min-height:3px}
.barras .b.act i{background:var(--amarillo)}
.barras .b span{font-size:11.5px;color:var(--apagado);text-transform:capitalize}
.barras .b em{font-style:normal;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.velo.centro{justify-content:center;align-items:center;padding:16px}
.modal{background:var(--verde);border:1px solid var(--verde-3);border-radius:12px;padding:22px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px}
.modal label{display:flex;flex-direction:column;gap:6px}
.modal input{width:100%;padding:11px 12px;font-size:18px;font-weight:700}
/* Resumen */
.res{display:flex;flex-direction:column;gap:14px}
.res .bloque{background:var(--verde-2);border:1px solid var(--linea);border-radius:10px;padding:14px 16px}
.res .accion{border-color:var(--naranja);background:#e0141e14}
.res h4{margin:0 0 8px;font:700 11.5px var(--f-label);letter-spacing:.07em;text-transform:uppercase;color:var(--amarillo)}
.res .accion h4{color:var(--naranja)}
.res dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.res dt{color:var(--apagado);font-size:13px}
.res dd{margin:0;min-width:0;overflow-wrap:anywhere}
.res .cita{font-style:italic}
.res .botones{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
a.btn{display:inline-block;text-decoration:none;text-align:center}
.wa-btn{background:#25a05a}
/* Operador */
.pie{border-top:1px solid var(--linea);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;background:var(--verde)}
.estado-bot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.compositor{display:flex;gap:10px;align-items:flex-end}
.compositor textarea{flex:1;min-width:0;resize:none;background:var(--verde-2);border:1px solid var(--verde-3);border-radius:8px;padding:10px 12px;color:var(--texto);font:inherit}
.burbuja.ase{align-self:flex-end;background:#ffffff1f;border:1px solid var(--amarillo);border-top-right-radius:3px}
.burbuja.ase small{color:var(--amarillo)}
/* Perdidos */
.rank{display:flex;flex-direction:column;gap:10px}
.rank .fila-r{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center}
.rank .barra{height:14px;background:#00000030;border-radius:4px;overflow:hidden}
.rank .barra i{display:block;height:100%;background:var(--naranja);border-radius:4px}
.rank .cnt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.rank .cnt small{color:var(--apagado);font-weight:500}
@media (max-width:560px){.rank .fila-r{grid-template-columns:90px 1fr auto}}
/* Chat */
.velo{position:fixed;inset:0;background:#000000cc;display:flex;justify-content:flex-end;z-index:50}
.velo[hidden]{display:none}
.cajon{width:min(480px,100%);height:100%;background:var(--verde);border-left:1px solid var(--verde-3);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.cajon header{padding:16px 18px;border-bottom:1px solid var(--linea);display:flex;justify-content:space-between;align-items:center;gap:12px}
.cajon header b{display:block;font:800 18px var(--f-display);letter-spacing:-.01em}
#chat-cuerpo{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px;background:#00000022}
.burbuja{max-width:85%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.burbuja.cli{align-self:flex-start;background:var(--verde-3);border-top-left-radius:3px}
.burbuja.bot{align-self:flex-end;background:#e0141e24;border:1px solid var(--naranja);border-top-right-radius:3px}
.burbuja small{display:block;font:700 11px var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--apagado);margin-bottom:3px}
.burbuja.bot small{color:var(--naranja)}
/* Chat estilo teléfono (WhatsApp) */
.velo{justify-content:center;align-items:center;padding:20px}
.cajon{width:min(400px,100%);height:min(860px,100%);border-radius:40px;border:8px solid #000000;box-shadow:0 0 0 2px var(--verde-3),0 24px 60px #000a;overflow:hidden;padding-top:0;background:#0d0d0d}
.cajon header{background:#1c1c1c;border-bottom:0;padding:14px 16px}
.cajon header b{font-size:17px}
.cajon header .sub{display:block;font-size:12px;color:#a8a8a8}
#chat-barra{background:#1c1c1c;border-bottom:1px solid #0a0a0a !important;padding-top:0 !important}
#chat-cuerpo{background:#0d0d0d radial-gradient(#1a1a1a 1.2px,transparent 1.2px) 0 0/18px 18px;gap:6px;padding:14px 12px}
.burbuja{max-width:80%;padding:7px 11px 8px;font-size:14px;line-height:1.35}
.burbuja.cli{background:#262626;border:0;border-radius:4px 14px 14px 14px}
.burbuja.bot{background:#3b1418;border:0;border-radius:14px 4px 14px 14px}
.burbuja.bot small{color:#ff7b7b}
.burbuja.ase{background:#444444;border:0;border-radius:14px 4px 14px 14px}
.burbuja small{margin-bottom:2px}
.cajon .pie{background:#0d0d0d;border-top:0;padding:6px 10px calc(10px + env(safe-area-inset-bottom,0px));gap:8px}
.rapidas{display:flex;gap:6px;flex-wrap:wrap}
.rapidas button{font:500 12px var(--f-body);padding:6px 10px;border-radius:999px;border:1px solid var(--amarillo);background:transparent;color:var(--amarillo);cursor:pointer}
.compositor{align-items:center}
.compositor textarea{border-radius:22px;background:#262626;border:0;padding:11px 16px;min-height:44px;box-sizing:border-box}
.compositor .btn{width:44px;height:44px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
@media (max-width:560px){.velo{padding:0}.cajon{width:100%;height:100%;border-radius:0;border:0;box-shadow:none;padding-top:env(safe-area-inset-top,0px)}}
.btn.chico{padding:4px 10px;font-size:13px;white-space:nowrap}
@media (max-width:560px){.marca b{font-size:28px}.kpi .n{font-size:38px}header .quien{margin-left:0;width:100%}}
@media (prefers-reduced-motion:no-preference){.vista{animation:ent .25s ease}@keyframes ent{from{opacity:.0;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>

async function cargar(){
  $('#msg').textContent = '';
  if(DEMO){ if(!D.contactos.length) D = demoData(); return; }
  const [c,q,t,i] = await Promise.all([
    db.from('contactos').select('*').order('ultimo_contacto',{ascending:false}).limit(1000),
    db.from('consultas').select('*, contactos(nombre,identificador,pais)').order('creada',{ascending:false}).limit(1000),
    db.from('turnos').select('*, consultas(medida,modelo,cantidad,contactos(nombre,identificador))').order('fecha',{ascending:true}).order('hora',{ascending:true}).limit(1000),
    db.from('indicadores').select('*').single()]);
  const fallo = [c,q,t,i].find(r => r.error);
  if(fallo) throw fallo.error;
  const [pf,tr] = await Promise.all([
    db.from('perfiles').select('*').order('nombre'),
    db.from('tareas').select('*').order('creada',{ascending:false}).limit(1000)]);
  ROLES_OK = !pf.error && !tr.error;
  D = {contactos:c.data, consultas:q.data, turnos:t.data, perfiles:pf.error ? [] : pf.data, tareas:tr.error ? [] : tr.data, ind:i.data};
}

async function pausarBot(ident, horas){

    ct.bot_pausado_hasta = hasta; renderPie();

async function enviarMensaje(){

function bloqueIngresos(){
  const ventas = D.consultas.filter(q => q.estado==='cerrada'), ahora = new Date();

  const meses = [5,4,3,2,1,0].map(i => { const d = new Date(ahora.getFullYear(), ahora.getMonth()-i, 1);

    return {et:MESES[d.getMonth()].slice(0,3), suma, act:i===0}; });
  const max = Math.max(...meses.map(m => m.suma), 1);

document.addEventListener('keydown', e => {

  const abierto = !$('#combo-lista').hidden;
  if(e.key==='ArrowDown' || e.key==='ArrowUp'){ e.preventDefault(); if(!abierto) return comboBuscar(); if(!comboRes.length) return; comboIdx = (comboIdx + (e.key==='ArrowDown'?1:-1) + comboRes.length) % comboRes.length; comboPintar(sinAcentos($('#tarea-contacto').value.trim())); }

async function crearTarea(){
  const titulo = $('#tarea-titulo').value.trim(), asig = $('#tarea-asig').value, vence = $('#tarea-vence').value || null, detalle = $('#tarea-detalle').value.trim() || null, hora = $('#tarea-hora').value || null;
  const txtC = $('#tarea-contacto').value.trim(); let contacto_id = null;
  if(!titulo) return; $('#tarea-error').textContent = '';
  if(txtC){ if(!tareaCid){ $('#tarea-error').textContent = 'Elegí un contacto de la lista (o dejá el campo vacío).'; return; } contacto_id = tareaCid; }
  $('#tarea-ok').disabled = true; tareaPre = null; tareaCid = null;
  try{
    let fila = {id:Math.max(0,...D.tareas.map(t => t.id))+1, titulo, detalle, asignado_a:asig, creada_por:UID, vence, hora, contacto_id, estado:'pendiente', creada:new Date().toISOString(), hecha_en:null};
    if(!DEMO){ const nuevo = {titulo, detalle, asignado_a:asig, vence}; if(hora) nuevo.hora = hora; if(contacto_id) nuevo.contacto_id = contacto_id; const {data, error} = await db.from('tareas').insert(nuevo).select('*').single(); if(error) throw error; fila = data; }
    D.tareas.unshift(fila); pintar();
  }catch(err){ $('#tarea-error').textContent = 'No se pudo crear: ' + (err.message||err) + '. ¿Ejecutaste permisos_roles.sql y permisos_tareas_contacto.sql, y sos supervisor?'; $('#tarea-ok').disabled = false; }
}
async function cambiarTarea(id, campos){
  const t = D.tareas.find(x => x.id===id); if(!t) return;
  try{ await actualizar('tareas', id, campos); Object.assign(t, campos); }
  catch(err){ $('#msg').textContent = 'No se pudo guardar la tarea: ' + (err.message||err); }
  pintar();
}
async function borrarTarea(id){
  if(!confirm('¿Eliminar esta tarea?')) return;
  try{ if(!DEMO){ const {error} = await db.from('tareas').delete().eq('id', id); if(error) throw error; } D.tareas = D.tareas.filter(t => t.id!==id); }
  catch(err){ $('#msg').textContent = 'No se pudo eliminar: ' + (err.message||err); }
  pintar();
}

async function moverContacto(contactoId, etapa){
  const c = D.contactos.find(x => x.id===contactoId); if(!c) return;
  try{
    let fila;
    if(DEMO){ fila = {id:Math.max(0,...D.consultas.map(q => q.id))+1, contacto_id:c.id, medida:null, modelo:null, cantidad:null, lead_calificado:false, estado:'abierta', creada:new Date().toISOString(), notas:null, contactos:c}; }
    else{
      const {data, error} = await db.from('consultas').insert({contacto_id:c.id, estado:'abierta', lead_calificado:false}).select('*, contactos(nombre,identificador,pais)').single();
      if(error) throw error; fila = data;
    }
    D.consultas.unshift(fila); pintar();
    if(etapa!=='abierta') await moverConsulta(fila.id, etapa);
  }catch(err){ $('#msg').textContent = 'No se pudo mover el contacto: ' + (err.message||err) + '. ¿Ejecutaste el SQL de permisos nuevo?'; }
}
async function moverConsulta(id, etapa){
  const q = D.consultas.find(x => x.id===id); if(!q || q.estado===etapa) return;
  if(etapa==='cerrada') return pedirMonto(id, true);
  if(etapa==='perdida') return pedirMotivo(id);
  const antes = q.estado;
  try{ await actualizar('consultas', id, {estado:etapa}); q.estado = etapa; pintar(); }
  catch(err){ q.estado = antes; $('#msg').textContent = 'No se pudo mover: ' + (err.message||err); }
}

function montoSugerido(q){
  if(q.monto!=null) return q.monto;
  const t = turnoDe(q); if(!t) return '';
  if(t.total!=null) return t.total;
  return (t.precio_unitario!=null && q.cantidad) ? t.precio_unitario*q.cantidad : '';
}

const MOTIVOS = {sin_stock:'Sin stock', precio:'Precio', no_respondio:'No respondió', cancelacion:'Cancelación del cliente', otro:'Otro'};
let fPerdidos = 'sin_stock', perdidaId = null, fPerdDesde = '', fPerdHasta = '', fPerdMedida = '', fPerdBusca = '';
const claveBusq = t => String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const fechaLocal = iso => { const d = new Date(iso); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
function coincidePerd(q){
  const toks = String(fPerdBusca||'').trim().split(/\s+/).map(claveBusq).filter(Boolean); if(!toks.length) return true;
  const c = q.contactos ?? {}, ct = ctDeId(q.contacto_id);
  const pajar = claveBusq([q.medida, q.modelo, c.nombre, c.identificador, q.notas, ...(etqsDe(ct))].join(' '));
  return toks.every(t => pajar.includes(t));
}
function rangoPerdidos(k){
  const hoy = new Date(), f = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, ant = n => { const d = new Date(); d.setDate(d.getDate()-n); return d; };
  if(k==='hoy'){ fPerdDesde = fPerdHasta = f(hoy); }
  else if(k==='7'){ fPerdDesde = f(ant(6)); fPerdHasta = f(hoy); }
  else if(k==='30'){ fPerdDesde = f(ant(29)); fPerdHasta = f(hoy); }
  else if(k==='mes'){ fPerdDesde = f(new Date(hoy.getFullYear(), hoy.getMonth(), 1)); fPerdHasta = f(hoy); }
  else { fPerdDesde = ''; fPerdHasta = ''; }
}
function pedirMotivo(id){
  const q = D.consultas.find(x => x.id===id); perdidaId = id;
  $('#perdida-sub').textContent = `${q.contactos?.nombre || q.contactos?.identificador || 'Cliente'} · ${q.cantidad ? q.cantidad+' × ' : ''}${q.medida||''}`;
  $('#perdida-motivo').value = q.motivo_perdida || 'sin_stock'; $('#perdida-error').textContent = ''; $('#perdida').hidden = false;
}
$('#form-perdida').addEventListener('submit', async e => {
  e.preventDefault();
  const q = D.consultas.find(x => x.id===perdidaId), campos = {estado:'perdida', motivo_perdida:$('#perdida-motivo').value};
  $('#perdida-ok').disabled = true;
  try{

    const id = Number(el.dataset.asignar), v = el.value || null;
    try{ await actualizar('consultas', id, {asignado_a:v}); const q = D.consultas.find(x => x.id===id); if(q) q.asignado_a = v; }
    catch(err){ $('#msg').textContent = 'No se pudo asignar: ' + (err.message||err) + '. ¿Ejecutaste permisos_roles.sql y sos supervisor?'; }
    return pintar();
  }
  if(el.dataset.tareaAsig){ return cambiarTarea(Number(el.dataset.tareaAsig), {asignado_a: el.value || null}); }
  if(el.id==='f-asig'){ fAsig = el.value; return pintar(); }
  if(el.id==='f-etq'){ fEtq = el.value; return pintar(); }
  if(el.id==='f-cal-tareas'){ fCalTareas = el.value; return pintar(); }
  if(el.id==='f-tareas'){ fTareas = el.value; return pintar(); }
  if(el.id==='f-tarea-op'){ fTareaOp = el.value; return pintar(); }
  if(el.dataset.moverC){ const v = el.value; el.value = ''; if(v) moverContacto(Number(el.dataset.moverC), v); return; }
  if(el.dataset.mover){ const v = el.value; el.value = ''; if(v) moverConsulta(Number(el.dataset.mover), v); return; }
  if(el.id==='f-agenda'){ fAgenda = el.value; return pintar(); }
  if(el.id==='f-consulta'){ fConsulta = el.value; return pintar(); }
  if(el.id==='f-perdidos'){ fPerdidos = el.value; return pintar(); }
  if(el.id==='f-perd-medida'){ fPerdMedida = el.value; return pintar(); }
  if(el.id==='f-perd-desde'){ fPerdDesde = el.value; return pintar(); }
  if(el.id==='f-perd-hasta'){ fPerdHasta = el.value; return pintar(); }
  if(el.dataset.t){
    try{
      await actualizar(el.dataset.t, Number(el.dataset.id), {[el.dataset.c]: el.value.trim()===''&&el.dataset.c==='notas' ? null : el.value});
      { const f = D[el.dataset.t]?.find(x => x.id===Number(el.dataset.id)); if(f) f[el.dataset.c] = el.value; }
      if(vista==='perdidos' && el.dataset.c==='motivo_perdida') return pintar();
      const ok = el.parentElement.querySelector('.guardado'); if(ok){ ok.hidden = false; setTimeout(()=>ok.hidden = true, 1800); }
      if(!DEMO && el.dataset.t==='turnos') await recargar(false);
    }catch(err){ $('#msg').textContent = 'No se pudo guardar: ' + (err.message||err); }
  }
});
$('#main').addEventListener('input', e => { if(e.target.id==='busca'){ busca = e.target.value; pintar(); } else if(e.target.id==='perd-busca'){ fPerdBusca = e.target.value; pintar(); } });
async function recargar(repintar=true){
  try{
    const antes = new Set(misPendientes().map(t => t.id));
    await cargar();
    const f = $('#form-tarea'), escribiendo = f && ($('#tarea-titulo').value || $('#tarea-contacto').value || $('#tarea-detalle').value);
    if(repintar && !escribiendo) pintar(); else if(repintar) renderNotif();
    if(!notifIniciado){ notifIniciado = true; avisoInicial(); }
    else { const nuevas = misPendientes().filter(t => !antes.has(t.id)); if(nuevas.length) toast(nuevas.length===1 ? `Te asignaron una tarea nueva: ${nuevas[0].titulo}` : `Te asignaron ${nuevas.length} tareas nuevas.`); }
  }catch(err){ $('#msg').textContent = 'No se pudieron cargar los datos: ' + (err.message||err) + '. Revisá que hayas ejecutado el SQL de permisos.'; }
}
$('#btn-actualizar').addEventListener('click', () => recargar());

/* ---------- Sesión ---------- */
function mostrarApp(email, uid){
  UID = uid; EMAIL = email; notifIniciado = false;
  $('#login').hidden = true; $('#app').hidden = false;
  $('#usuario').textContent = email; $('#demo-aviso').hidden = !DEMO;
  recargar();
  clearInterval(window.__t); window.__t = setInterval(() => recargar(), 60000);
}
$('#form-login').addEventListener('submit', async e => {
  e.preventDefault();
  const b = $('#btn-login'); b.disabled = true; $('#login-error').textContent = '';
  const {data, error} = await db.auth.signInWithPassword({email:$('#email').value.trim(), password:$('#clave').value});
  b.disabled = false;
  if(error){ $('#login-error').textContent = 'Correo o contraseña incorrectos.'; return; }
  mostrarApp(data.user.email, data.user.id);
});
$('#btn-salir').addEventListener('click', async () => {
  clearInterval(window.__t);
  if(!DEMO) await db.auth.signOut();
  $('#app').hidden = true; $('#login').hidden = false; $('#clave').value = '';
  if(DEMO) mostrarApp('demo@topneumaticos','u1');
});
(async function iniciar(){
  if(DEMO){ mostrarApp('demo@topneumaticos','u1'); return; }
  db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const {data} = await db.auth.getSession();
  if(data.session) mostrarApp(data.session.user.email, data.session.user.id); else $('#login').hidden = false;
})();
</script>
